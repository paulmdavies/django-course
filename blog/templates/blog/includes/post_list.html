{% load static %}

{% for post in posts reversed %}
    <img>
        <a href={% url 'post' post.slug %}>
            <h3>{{ post.title }}</h3>
            <h6>{{ post.date }}</h6>
            <img class="post-preview-image" src={% static 'blog/images/'|add:post.image %} alt="No image found">
            <h5>{{ post.summary }}</h5>
        </a>
    </div>
{% endfor %}
