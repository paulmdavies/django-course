{% extends 'base.html' %}

{% block title %}
    All Posts
{% endblock %}

{% block content %}
    <h2>All Posts</h2>
    {% for slug, title in post_titles.items reversed %}
        <div>
            <h3><a href={% url 'post' slug %}>{{ title }}</a></h3>
        </div>
    {% endfor %}

{% endblock %}
