{% extends 'base.html' %}

{% block title %}
    Authors
{% endblock %}

{% block content %}
    <h2>Authors</h2>
    {% for author in authors %}
        <a href={% url 'author' author.slug %}>
            <h3>{{ author.first_name }} {{ author.last_name }}</h3>
        </a>
        </div>
    {% endfor %}

{% endblock %}
