{% extends 'reviews/base.html' %}

{% block title %}
	Reviews
{% endblock %}

{% block content %}
    <ul>
        {% for review in reviews %}
            <li><a href={% url 'review_detail' review.id %}>{{ review.user_name }}</a> ({{ review.star_rating }})</li>
        {% endfor %}
    </ul>
{% endblock %}
